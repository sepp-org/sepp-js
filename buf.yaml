# This package vendors the sepp wire contract under `proto/` (a validate-stripped
# snapshot of queue.proto plus the google well-known imports). It is NOT the
# source of truth: the contract lives in the sepp `proto` repo and is published
# to buf.build/sepp-org/sepp-proto.
#
# Refresh the snapshot from the published module, then re-strip the
# buf.validate annotations (they are server-enforced and add no value to a
# generated client):
#
#     buf export buf.build/sepp-org/sepp-proto:v1.1.0 -o proto
#
# Code generation (`npm run gen`) reads this workspace and emits TypeScript into
# src/gen via ts-proto. The google well-known types are bundled by buf.
version: v2
modules:
  - path: proto
