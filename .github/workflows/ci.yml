name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Cancel superseded runs for the same ref, except on tag pushes — every release
# tag should produce its own publish regardless of whether a newer tag arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test -- --exclude="test/integration.test.ts"

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/integration.test.ts

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # npm audit works off package-lock.json alone, no install needed
      - run: npm audit --omit=dev

  npm-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs prepublishOnly (build) and shows the exact publish contents
      - run: npm publish --dry-run

  # Publishes via OIDC trusted publishing — no token secret. Requires the
  # trusted publisher config on npmjs.com (repo sepp-org/sepp-js, workflow
  # ci.yml, action "npm publish"). Provenance is automatic with OIDC.
  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, build, test, integration, npm-publish-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC needs npm >= 11.5.1; node 22 bundles npm 10
      - run: npm install -g npm@latest
      - run: npm ci
      # Skip if this version is already on npm.
      # If some jobs failed for example and we need to re-tag.
      - run: |
          version=$(node -p "require('./package.json').version")
          if npm view "sepp-js@$version" version >/dev/null 2>&1; then
            echo "sepp-js $version already on npm, skipping publish"
          else
            npm publish
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest = just this release's commits; --strip header = no preamble
          args: --latest --strip header
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
