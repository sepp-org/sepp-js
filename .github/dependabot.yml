version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      grpc:
        patterns:
          - "@grpc/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
